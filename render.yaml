services:
  - type: keyvalue
    name: abhay123abhi-news-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: abhay123abhi-news-api
    region: singapore
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: GUARDIAN_API_KEY
        sync: false
      - key: NYT_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: AI_REQUESTS_PER_MINUTE
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NEWS_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: NEWS_READ_TIMEOUT_MS
        value: "20000"
      - key: NEWS_PROVIDER_TIMEOUT
        value: 35s
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: abhay123abhi-news-cache
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://abhay123abhi-news-web.onrender.com

  - type: web
    name: abhay123abhi-news-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://abhay123abhi-news-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
