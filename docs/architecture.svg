<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Newsroom Intelligence system architecture</title>
  <desc id="desc">Architecture showing React, Spring Boot, Guardian and New York Times aggregation, Redis for news and AI caching, Gemini with timeout retry and circuit breaker protection, structured AI output, validated citations, and Render deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#635bff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="news" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769aa"/>
      <stop offset="1" stop-color="#2b8bd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8d96b8"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f7f8ff}.sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#aab2cf}.h{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.t{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#d9def2}.s{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#9fa8c7}.darkh{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#172033}.darkt{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#33415c}.line{stroke:#8d96b8;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8d96b8;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}.label{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#b7bfd8;letter-spacing:.04em}.box{rx:18;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1230" cy="80" r="180" fill="#635bff" opacity=".07"/>
  <circle cx="120" cy="820" r="220" fill="#20c889" opacity=".05"/>

  <text x="70" y="68" class="title">Newsroom Intelligence — System Architecture</text>
  <text x="70" y="98" class="sub">Trusted news aggregation first, with Redis-backed, source-grounded Gemini intelligence as an optional layer.</text>

  <!-- Browser -->
  <rect x="70" y="190" width="245" height="190" class="box" fill="#ffffff"/>
  <text x="95" y="225" class="darkh">React 18 + Vite</text>
  <text x="95" y="254" class="darkt">Search + pagination</text>
  <text x="95" y="278" class="darkt">Guardian / NYT feed</text>
  <text x="95" y="302" class="darkt">AI Workspace</text>
  <text x="95" y="326" class="darkt">Structured sections</text>
  <text x="95" y="350" class="darkt">Clickable source citations</text>
  <rect x="95" y="360" width="118" height="22" rx="11" fill="#e9fff6"/>
  <text x="108" y="375" style="font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#138a62">STATIC ON RENDER</text>

  <!-- Spring -->
  <rect x="455" y="145" width="345" height="285" class="box" fill="url(#api)"/>
  <text x="485" y="185" class="h">Spring Boot API · Java 21</text>
  <text x="485" y="218" class="t">NewsController / AggregationService</text>
  <text x="485" y="243" class="t">AiController / AiInsightService</text>
  <text x="485" y="268" class="t">Trusted feed context + input bounds</text>
  <text x="485" y="293" class="t">Versioned AI cache-key generation</text>
  <text x="485" y="318" class="t">Structured JSON parsing</text>
  <text x="485" y="343" class="t">Source-ID citation validation</text>
  <text x="485" y="368" class="t">Provider abstractions + validation</text>
  <text x="485" y="393" class="t">Feature flag + concurrency guard</text>
  <rect x="485" y="405" width="180" height="24" rx="12" fill="#ffffff" opacity=".16"/>
  <text x="500" y="421" style="font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#fff">DOCKER WEB SERVICE</text>

  <!-- Redis -->
  <rect x="455" y="530" width="300" height="155" class="box" fill="#ef4444"/>
  <text x="485" y="568" class="h">Redis</text>
  <text x="485" y="598" class="t">Buffered feed sessions</text>
  <text x="485" y="623" class="t">AI response cache</text>
  <text x="485" y="648" class="t">Shared minute/day attempt budget</text>
  <text x="485" y="672" class="s" style="fill:#fee2e2">Local news fallback; new AI pauses</text>

  <!-- External news -->
  <rect x="935" y="135" width="365" height="210" class="box" fill="#11182a" stroke="#3e4b70"/>
  <text x="965" y="171" class="h">News Provider Layer</text>
  <rect x="965" y="198" width="140" height="108" rx="14" fill="url(#news)"/>
  <text x="987" y="233" class="h">Guardian</text>
  <text x="987" y="260" class="t">Feign adapter</text>
  <text x="987" y="285" class="s" style="fill:#dceeff">Provider API</text>
  <rect x="1125" y="198" width="140" height="108" rx="14" fill="#f3f0e8"/>
  <text x="1147" y="233" class="darkh">NYT</text>
  <text x="1147" y="260" class="darkt">Feign adapter</text>
  <text x="1147" y="285" class="darkt">Article Search</text>

  <!-- AI -->
  <rect x="875" y="465" width="425" height="275" class="box" fill="url(#ai)"/>
  <text x="905" y="505" class="h">Gemini Intelligence Layer</text>
  <text x="905" y="538" class="t">AiProvider → GeminiAiProvider</text>
  <text x="905" y="563" class="t">Gemini model via REST</text>
  <text x="905" y="588" class="t">Timeout + transient retry</text>
  <text x="905" y="613" class="t">Budgeted retries + 429 cooldown</text>
  <text x="905" y="638" class="t">Circuit breaker</text>
  <text x="905" y="663" class="t">Structured JSON generation</text>
  <text x="905" y="688" class="t">Daily brief · Ask · Compare</text>
  <rect x="905" y="704" width="145" height="28" rx="14" fill="#0b1020" opacity=".28"/>
  <text x="922" y="722" style="font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#fff">AI_ENABLED=true</text>
  <rect x="1065" y="704" width="200" height="28" rx="14" fill="#0b1020" opacity=".16"/>
  <text x="1082" y="722" style="font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#fff">SOURCE-GROUNDED</text>

  <!-- Render -->
  <rect x="70" y="575" width="245" height="135" class="box" fill="#20c889"/>
  <text x="95" y="613" class="h">Render Blueprint</text>
  <text x="95" y="643" class="t">Static Site</text>
  <text x="95" y="667" class="t">Docker Web Service</text>
  <text x="95" y="691" class="t">Key Value / Redis</text>

  <!-- Connections -->
  <path d="M315 282 C370 282 400 282 455 282" class="line"/>
  <text x="345" y="264" class="label">/api</text>

  <path d="M800 232 C850 232 885 232 935 232" class="line"/>
  <text x="833" y="214" class="label">CONCURRENT FETCH</text>

  <path d="M605 430 C605 465 605 495 605 530" class="line"/>
  <text x="620" y="486" class="label">CACHE-ASIDE</text>

  <path d="M755 604 C810 604 835 604 875 604" class="line"/>
  <text x="774" y="584" class="label">AI CACHE MISS</text>

  <path d="M875 660 C825 690 790 665 755 650" class="dash"/>
  <text x="770" y="708" class="label">CACHE STRUCTURED RESPONSE</text>

  <path d="M875 545 C840 500 830 370 800 350" class="dash"/>
  <text x="812" y="454" class="label">VALIDATED JSON + CITATIONS</text>

  <path d="M315 635 C365 605 405 580 455 580" class="dash"/>
  <text x="327" y="588" class="label">MANAGED REDIS</text>

  <!-- Footer principles -->
  <rect x="70" y="790" width="1230" height="64" rx="16" fill="#ffffff" opacity=".055" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="95" y="817" class="label">DESIGN PRINCIPLE</text>
  <text x="95" y="840" class="t">AI is optional. News stays usable during failures. Redis guards shared AI attempts; citations reference server-held excerpts.</text>
</svg>